<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>물류 요청 | Entropy Makeup</title>
  <!-- 물류 요청은 영업 대시보드(index.html)의 탭으로 옮겼다. 이미 보낸 슬랙 링크(logistics.html?id=…)를 위해 주소만 넘겨 준다. -->
  <script>
    (function(){
      var id='';
      try{id=new URLSearchParams(location.search).get('id')||'';}catch(e){}
      var to='index.html?logistics='+(id?encodeURIComponent(id):'1');
      location.replace(to);
      document.addEventListener('DOMContentLoaded',function(){var a=document.getElementById('go');if(a)a.href=to;});
    })();
  </script>
</head>
<body style="font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px">
  <p>물류 요청은 영업 대시보드로 옮겼어요. 잠시 후 이동하지 않으면 <a id="go" href="index.html?logistics=1">여기를 눌러 주세요</a>.</p>
</body>
</html>
